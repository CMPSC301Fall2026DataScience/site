name: Build and Deploy Quarto Site with JupyterLite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 'release'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter
          pip install numpy pandas matplotlib seaborn plotly scikit-learn scipy statsmodels

      - name: Install WebR kernel for JupyterLite
        run: |
          git clone https://github.com/r-wasm/jupyterlite-webr-kernel
          cd jupyterlite-webr-kernel
          pip install .
          cd ..
          # WebR kernel will install compatible jupyterlite-core version
          
      - name: Install JupyterLite packages
        run: |
          # Install or upgrade to ensure compatible versions
          pip install --upgrade jupyterlite-core jupyterlite-pyodide-kernel

      - name: Render Quarto site
        run: |
          quarto render

      - name: Build JupyterLite with Python and WebR
        run: |
          jupyter lite build --lite-dir live --output-dir docs/live --base-url /site/live/
          
      - name: Fix baseUrl for GitHub Pages
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json
          config_path = 'docs/live/jupyter-lite.json'
          with open(config_path, 'r') as f:
              config = json.load(f)
          config['jupyter-config-data']['baseUrl'] = '/site/live/'
          with open(config_path, 'w') as f:
              json.dump(config, f, indent=2)
          print("✅ baseUrl updated to '/site/live/'")
          PYTHON_SCRIPT
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Build and Deploy Quarto Site with JupyterLite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 'release'

      - name: Install JupyterLite and kernels
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "jupyterlite-core>=0.4.0,<0.6.0" \
            "jupyterlab>=4.0.0,<5.0.0" \
            "jupyterlite-pyodide-kernel>=0.4.0,<0.6.0" \
            "jupyterlite-webr>=0.5.0,<0.6.0"

      - name: Render Quarto site
        run: quarto render

      - name: Build JupyterLite with Python and R kernels
        working-directory: live
        run: jupyter lite build --contents content --output-dir ../docs/live

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Build and Deploy Quarto Site with JupyterLite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 'release'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyterlite-core==0.5.1 jupyterlab~=4.3.5 notebook~=7.3.2
          pip install notebook jupyterlite-p5-kernel jupyterlab-fasta jupyterlab-geojson jupyterlab-night jupyterlab_miami_nights 
          pip install numpy pandas matplotlib seaborn plotly scikit-learn scipy statsmodels

      - name: Render Quarto site
        run: |
          quarto render

      - name: Build JupyterLite
        run: |
          python -m jupyterlite_core.app build --contents live/content --output-dir docs/live

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
